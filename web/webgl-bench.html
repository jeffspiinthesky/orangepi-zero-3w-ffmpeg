<!doctype html>
<meta charset="utf-8">
<title>WebGL fill-rate test</title>
<style>html,body{margin:0;height:100%;background:#000;color:#0f0;font:20px monospace}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:8px;left:8px;background:#000a;padding:6px 10px}</style>
<canvas id="c"></canvas><div id="hud">starting…</div>
<script>
// Full-screen fragment shader (raymarched blobs): pure GPU load.
const c = document.getElementById('c'), hud = document.getElementById('hud');
const gl = c.getContext('webgl2') || c.getContext('webgl');
window.result = { renderer: 'none', fps: 0 };
if (!gl) { hud.textContent = 'WebGL unavailable'; }
else {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `precision mediump float;uniform float t;uniform vec2 r;
  float map(vec3 p){float d=1e9;for(int i=0;i<4;i++){float fi=float(i);
   vec3 o=vec3(sin(t*.7+fi*1.3),cos(t*.5+fi*2.1),sin(t*.3+fi))*1.2;d=min(d,length(p-o)-.45);}return d;}
  void main(){vec2 uv=(gl_FragCoord.xy*2.-r)/r.y;vec3 ro=vec3(0,0,-4),rd=normalize(vec3(uv,1.5));
   float d=0.;for(int i=0;i<24;i++){float h=map(ro+rd*d);if(h<.001||d>10.)break;d+=h;}
   vec3 col=vec3(0.);if(d<10.){vec3 p=ro+rd*d;vec2 e=vec2(.001,0);
   vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
   col=.5+.5*cos(t+p.xyx+vec3(0,2,4));col*=max(dot(n,normalize(vec3(1,1,-1))),.1);}
   gl_FragColor=vec4(col,1.);}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const ut = gl.getUniformLocation(pr, 't'), ur = gl.getUniformLocation(pr, 'r');
  let frames = 0, last = performance.now();
  function frame(now) {
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; gl.viewport(0, 0, w, h); }
    gl.uniform1f(ut, now / 1000); gl.uniform2f(ur, w, h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); frames++;
    if (now - last >= 1000) {
      window.result = { renderer, fps: Math.round(frames * 1000 / (now - last)), size: w + 'x' + h };
      hud.textContent = `${window.result.fps} fps  ${w}x${h}  ${renderer}`; frames = 0; last = now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
